<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idioms - Log in</title>

    <link rel="stylesheet" href="../src/css/style.css" />
    <link rel="manifest" href="../assets/icons/manifest.json">
    <meta name="theme-color" content="#1976d2">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
</head>
<body>
    <div id="splash-screen" class="splash-screen" role="status" aria-label="Cargando voKblo">
        <img src="../assets/images/android-chrome-512x512.png" alt="Logo de voKblo" />
        <p>Preparando tu espacio de aprendizaje...</p>
        <span class="splash-loader" aria-hidden="true"></span>
    </div>
    <div id="pantalla-login" class="pantalla-activa" style="text-align: center; padding: 2rem;">
        <img src="../assets/images/eis.jpg" alt="voKblo Logo" style="width: 120px; height: 120px;">
        
        <h1 style="margin-top: 1rem;">Idioms</h1>
        <p>Idioms with interactive activities for learners</p>

         <div style="max-width: 300px; margin: 0 auto; text-align: left;">
        <label>E-mail:</label>
        <input type="email" id="input-email" placeholder="ejemplo@europaschool.org" style="width: 100%; margin-bottom: 15px;">
        
        <label>Password:</label>
        <input type="password" id="input-password" placeholder="Tu contraseña" style="width: 100%; margin-bottom: 20px;">
        
        <button id="btn-acceder" style="width: 100%;">Go</button>
        <div id="status-message" style="margin-top: 10px; font-weight: bold;"></div>
      </div>
   </div> 
    <footer style="text-align:center; margin-top: 30px; font-size: 14px;">
         by DGR 2026
    </footer>

    <script src="../src/js/core/config.js"></script>    <!-- 1º La URL -->
    <script src="../src/js/login.js"></script>
    <script src="../src/js/register-service-worker.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splashScreen = document.getElementById("splash-screen");
            window.setTimeout(() => {
                splashScreen.classList.add("splash-screen--hidden");
                splashScreen.addEventListener("transitionend", () => {
                    splashScreen.remove();
                }, { once: true });
                window.setTimeout(() => splashScreen.remove(), 350);
            }, 700);
        });
    </script>
</body>
</html>
